<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Wezen</title>
<style>
:root {
  color-scheme: dark;
}

html,
body {
  margin: 0;
  width: 1280px;
  height: 640px;
  overflow: hidden;
  background: #0f1328;
  color: #f3f3f3;
  font-family: "Segoe UI Variable Display", "Segoe UI", "Yu Gothic UI", "Meiryo UI", sans-serif;
}

.stage {
  position: relative;
  width: 1280px;
  height: 640px;
  overflow: hidden;
}

.copy {
  position: absolute;
  left: 72px;
  top: 72px;
  width: 520px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 22px;
}

.brand img {
  width: 96px;
  height: 96px;
}

h1 {
  margin: 0;
  font-size: 80px;
  font-weight: 700;
  line-height: 1;
}

.tagline {
  margin: 32px 0 0;
  font-size: 28px;
  font-weight: 600;
  line-height: 1.45;
}

ul {
  margin: 26px 0 0;
  padding: 0;
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 19px;
  color: #c9cbd6;
}

/* 点の色は、アイコンの山の線にそろえる */
li::before {
  content: "";
  width: 8px;
  height: 8px;
  border-radius: 4px;
  background: #5cb4ff;
  flex-shrink: 0;
}

.meta {
  position: absolute;
  left: 72px;
  bottom: 72.5px;
  font-size: 15px;
  color: #8b8fa6;
}

/* 本体ウィンドウ */
.window {
  position: absolute;
  border: 0;
  background: transparent;
  filter: drop-shadow(0 24px 40px rgba(0, 0, 0, 0.55));
}

/* 左の奥にダークの縦積み、右の手前にライトの 2 列を少し重ねて置く */
.window.dark {
  left: 640px;
  top: 56px;
  width: 340px;
  height: 440px;
}

.window.light {
  /* 中のページと同じ配色にしないと、ブラウザが iframe に不透明な背景を描く */
  color-scheme: light;
  left: 760px;
  top: 320px;
  width: 460px;
  height: 260px;
}
</style>
</head>
<body>
<div class="stage">
  <div class="copy">
    <div class="brand">
      <img src="../../../src-tauri/icons/icon.svg" alt="">
      <h1>Wezen</h1>
    </div>
    <p class="tagline">PC の負荷を<br>小さなグラフでひと目で</p>
    <ul>
      <li>CPU・Memory・I/O・GPU・Disk・Network</li>
      <li>左右対称のなだらかな山で描くグラフ</li>
      <li>縦積み・2 列・帯の 3 つのレイアウト</li>
      <li>ライトテーマ・ダークテーマに対応</li>
    </ul>
  </div>
  <div class="meta">Windows 10 / 11 · Rust + Tauri · MIT License</div>
  <iframe class="window dark" src="build/monitor.html?theme=dark&amp;layout=stack" title="本体ウィンドウ（縦積み、ダーク）"></iframe>
  <iframe class="window light" src="build/monitor.html?theme=light&amp;layout=grid" title="本体ウィンドウ（2 列、ライト）"></iframe>
</div>
</body>
</html>
